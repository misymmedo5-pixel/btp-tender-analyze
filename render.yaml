services:
  - type: web
    name: btp-tender-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
